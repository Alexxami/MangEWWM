# More option see https://github.com/DreamMaoMao/mango/wiki/

monitorrule=name:^DP-3$,width:1440,height:900,refresh:75,x:0,y:0

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 0
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=800
animation_duration_open=800
animation_duration_tag=800
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

exec-once = export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
exec-once = dunst 
exec-once = exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Mango
exec-once = dbus-update-activation-environment XDG_CURRENT_DESKTOP
exec-once = ~/.config/mango/autostart
exec-once = bash -c 'eww open clock && eww open visualizer_window && eww open bar_widget && eww update get_vol="$(pamixer --get-volume)" && ~/.config/eww/scripts/getvol.sh & ~/.config/eww/scripts/workspace.sh '
exec-once = swaybg -i ~/.config/wallpapers/nord1.png

# Scroller Layout Setting
scroller_structs=10
scroller_default_proportion=0.95
scroller_focus_center=1
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=es


# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=10
gappoh=15
gappov=15
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x201b14ff
bordercolor=0xd8dee9ff
focuscolor=0x3b4252ff
maximizescreencolor=0xb48eadff
urgentcolor=0xbf616aff
scratchpadcolor=0xebcb8bff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
dropcolor=0xb48eadbb

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:vertical_scroller
tagrule=id:2,layout_name:vertical_scroller
tagrule=id:3,layout_name:vertical_scroller
tagrule=id:4,layout_name:vertical_scroller
tagrule=id:5,layout_name:vertical_scroller
tagrule=id:6,layout_name:vertical_scroller

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,r, spawn,sh ~/.config/mango/script/waybar.sh

# Salir de mango
bind=SUPER+SHIFT,e,spawn,sh ~/.config/eww/scripts/usrctl.sh

# Screenshots
bind=SUPER+SHIFT,s,spawn,bash ~/.config/mango/script/shot.sh
bind=SUPER+CTRL,s,spawn,bash ~/.config/mango/script/shot.sh --full
bind=SUPER+SHIFT+CTRL,s,spawn,bash ~/.config/mango/script/tempshot2seg.sh
bind=SUPER,s,spawn,slurp
# Launchers
bind=SUPER,d,spawn,sh ~/.config/rofi/launchers/type-7/launcher.sh
bind=SUPER,w,spawn,sh ~/.config/rofi/launchers/type-7/window.sh
bind=SUPER,q,spawn,~/.config/rofi/quicklinks/bin/quicklinks.sh
# bind=SUPER,m,spawn,~/.config/rofi/applets/bin/mpd.sh
bind=SUPER,e,spawn,~/.config/rofi/files/bin/files.sh
bind=SUPER,period,spawn,python3 ~/.config/mango/script/stickers.py
bind=SUPER+CTRL,r,spawn,~/.config/mango/script/toggle_dark_light_mode.sh
bind=SUPER,l,spawn,hyprlock
bind=NONE,code:51,spawn,wtype "<"
bind=SHIFT,code:51,spawn,wtype ">"


bind=SUPER,Return,spawn,kitty

# exit
bind=SUPER+SHIFT,q,killclient,

# switch window focus
bind=SUPER,Tab,spawn,~/.config/rofi/powermenu/type-6/record.sh
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,space,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# switch layout
bind=SUPER,n,spawn,bash ~/.config/mango/script/swap_layout_a.sh
bind=SUPER+SHIFT,n,spawn,bash ~/.config/mango/script/swap_layout_b.sh

# tag switch

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0


# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize



# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
