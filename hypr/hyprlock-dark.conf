# ============================================
# TEMA: NORD OSCURO (Dark)
# Paleta: Polar Night (fondos) + Snow Storm (textos) + Frost (acentos)
# ============================================

# ============================================
# OPCIÓN 1 (ACTIVA): Fondo captura pantalla + desenfoque nativo
# ============================================
background {
    monitor =
    path = screenshot          # Captura la pantalla actual
    blur_passes = 3            # Número de pasadas de desenfoque
    blur_size = 7              # Tamaño del desenfoque
    brightness = 0.5           # Brillo reducido para ambiente oscuro
    # noise = 0.0117
    # contrast = 0.9
}

# ============================================
# OPCIÓN 2 (COMENTADA): Fondo con imagen fija (si prefieres wallpaper)
# ============================================
# background {
#     monitor =
#     path = ~/.wallpapers/nord-dark.png
#     blur_passes = 3
#     blur_size = 7
#     brightness = 0.5
# }

# === CAJA PRINCIPAL (Hora y contraseña) ===

# Borde exterior (Nord Frost: azul #81A1C1)
shape {
    monitor =
    size = 506, 486
    rounding = 23
    color = rgb(129, 161, 193)      # Frost #81A1C1
    position = 0, 0
    halign = center
    valign = center
}

# Fondo caja principal (Nord Polar Night #2E3440 con opacidad)
shape {
    monitor =
    size = 500, 480
    rounding = 20
    color = rgba(46, 52, 64, 0.95)   # Polar Night oscuro
    position = 0, 0
    halign = center
    valign = center
}

# Horas (texto Snow Storm claro)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    font_size = 72
    font_family = KogniGear Bold
    color = rgb(236, 239, 244)       # Snow Storm #ECEFF4
    position = 0, -140
    halign = center
    valign = center
}

# Minutos
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"
    font_size = 72
    font_family = KogniGear Bold
    color = rgb(236, 239, 244)
    position = 0, -60
    halign = center
    valign = center
}

# Fecha (Snow Storm más suave)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d de %B')"
    font_size = 18
    font_family = KogniGear Bold
    color = rgb(216, 222, 233)       # Snow Storm #D8DEE9
    position = 0, 25
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 280, 52
    rounding = 12
    outline_thickness = 2
    outer_color = rgb(129, 161, 193)    # Frost #81A1C1
    inner_color = rgb(59, 66, 82)       # Polar Night #3B4252
    font_color = rgb(236, 239, 244)     # Snow Storm #ECEFF4
    placeholder_text = <i>Contraseña...</i>
    position = 0, 80
    halign = center
    valign = center

    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    dots_color = rgb(236, 239, 244)     # Puntos en Snow Storm
    
    fail_color = rgb(191, 97, 106)      # Nord Aurora Red #BF616A
    fail_text = Contraseña incorrecta
    fail_transition = 300
}

# Mensaje de bienvenida
label {
    monitor =
    text = ¡Bienvenido!
    font_size = 14
    font_family = KogniGear Bold
    color = rgb(216, 222, 233)          # Snow Storm #D8DEE9
    position = 0, 130
    halign = center
    valign = center
}

# === CAJA DE ACCIONES (Esquina inferior derecha) ===

# Borde exterior de la caja de acciones (Frost)
shape {
    monitor =
    size = 185, 65 
    rounding = 22
    color = rgb(129, 161, 193)          # Frost #81A1C1
    position = -8, 13
    halign = right
    valign = bottom
}

# Fondo de la caja de acciones (Polar Night)
shape {
    monitor =
    size = 180, 60 
    rounding = 20
    color = rgb(46, 52, 64)             # Polar Night #2E3440
    border_size = 0
    border_color = rgb(76, 86, 106)
    position = -10, 15
    halign = right
    valign = bottom
}

# === CÍRCULO APAGAR ===
shape {
    monitor =
    size = 40, 40
    rounding = 20
    color = rgb(129, 161, 193)          # Frost #81A1C1
    position = -30, 25
    halign = right
    valign = bottom
}

label {
    monitor =
    text = 󰐥 
    font_size = 20
    font_family = Symbols Nerd Font
    color = rgb(46, 52, 64)             # Polar Night para ícono
    position = -41, 30
    halign = right
    valign = bottom
    onclick = doas /sbin/openrc-shutdown -p now
}

# === CÍRCULO REINICIAR ===
shape {
    monitor =
    size = 40, 40
    rounding = 20
    color = rgb(129, 161, 193)
    position = -80, 25
    halign = right
    valign = bottom
}

label {
    monitor =
    text =  
    font_size = 20
    font_family = Symbols Nerd Font
    color = rgb(46, 52, 64)
    position = -90, 30
    halign = right
    valign = bottom
    onclick = doas /sbin/openrc-shutdown -r now
}

# === CÍRCULO LOGOUT ===
shape {
    monitor = 
    size = 40, 40
    rounding = 20
    color = rgb(129, 161, 193)
    position = -130, 25
    halign = right
    valign = bottom
}

label {
    monitor =
    text =  
    font_size = 20
    font_family = Symbols Nerd Font
    color = rgb(46, 52, 64)
    position = -136, 30
    halign = right
    valign = bottom
    onclick = pkill -u $USER 
}