}

# === CÍRCULO LOGOUT ===
shape {
    monitor = 
    size = 40, 40
    rounding = 20
    color = rgb(46,52,64)
    position = -130, 25
    halign = right
    valign = bottom
}

label {
    monitor =
    text =  
    font_size = 20
    font_family = Symbols Nerd Font
    color = rgb(229,233,240)
    position = -136, 30
    halign = right
    valign = bottom
    onclick = pkill -u $USER 
}